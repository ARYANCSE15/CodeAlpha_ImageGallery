<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Player</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="player-card">
    <!-- Album Art / Thumbnail -->
    <div class="cover-art">
      <img id="cover" src="https://picsum.photos/300/300?random=1" alt="Album Cover">
    </div>

    <!-- Song Info -->
    <div class="song-details">
      <h2 id="title">Loading...</h2>
      <h3 id="artist">Please wait</h3>
    </div>

    <!-- Progress Bar -->
    <div class="progress-container">
      <input type="range" id="progress" min="0" value="0" step="0.1">
      <div class="time-info">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <!-- Playback Controls -->
    <div class="controls">
      <button id="prev-btn" title="Previous"><i class="fas fa-step-backward"></i></button>
      <button id="play-btn" class="play-main" title="Play/Pause"><i class="fas fa-play"></i></button>
      <button id="next-btn" title="Next"><i class="fas fa-step-forward"></i></button>
    </div>

    <!-- Volume & Options Controls -->
    <div class="bottom-controls">
      <div class="volume-container">
        <i class="fas fa-volume-up" id="volume-icon"></i>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
      </div>
      <label class="upload-btn" title="Upload local music">
        <i class="fas fa-plus"></i> Add Files
        <input type="file" id="file-input" accept="audio/*" multiple hidden>
      </label>
    </div>

    <!-- Playlist Section -->
    <div class="playlist-section">
      <h4><i class="fas fa-list"></i> Playlist</h4>
      <ul id="playlist-items"></ul>
    </div>
  </div>

  <!-- Hidden Audio Element -->
  <audio id="audio"></audio>

  <script src="script.js"></script>
</body>
</html>
